<style>
/* Layout: case-file review desk. Left rail = docket of 30 files; centre = the file; right = policy binder. */
:root {
  --bg: #f3f5f7; --paper: #ffffff; --ink: #18212b; --muted: #5b6875; --line: #d9dfe5;
  --accent: #1d5c8c; --accent-soft: #e3eef7; --ok: #1f7a4d; --ok-soft: #e2f3ea; --bad: #a83a2f; --bad-soft: #f8e5e2;
  --warn: #8a5a00; --warn-soft: #fbf0d8; --focus: #2f7fc1;
  --f-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-doc: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --f-head: "IBM Plex Serif", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161c; --paper: #18202a; --ink: #e4e9ee; --muted: #9aa7b4; --line: #2c3743;
  --accent: #7db4e3; --accent-soft: #1d2f40; --ok: #6cc597; --ok-soft: #173326; --bad: #ec8b80; --bad-soft: #3a1f1c;
  --warn: #e6b65c; --warn-soft: #3a2f17; --focus: #7db4e3; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161c; --paper: #18202a; --ink: #e4e9ee; --muted: #9aa7b4; --line: #2c3743;
  --accent: #7db4e3; --accent-soft: #1d2f40; --ok: #6cc597; --ok-soft: #173326; --bad: #ec8b80; --bad-soft: #3a1f1c;
  --warn: #e6b65c; --warn-soft: #3a2f17; --focus: #7db4e3; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-ui); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; max-width: 1400px; margin: 0 auto; }
header.top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; padding-block: 8px 16px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
h1 { font: 600 1.35rem/1.2 var(--f-head); margin: 0; text-wrap: balance }
.sub { color: var(--muted); font-size: .85rem }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.seg button { border: 0; background: var(--paper); color: var(--ink); padding: 6px 12px; font: 500 .85rem var(--f-ui); cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--paper) }
button, .btn { font: 500 .9rem var(--f-ui); border-radius: 6px; cursor: pointer }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--paper); padding: 9px 16px }
.btn.ghost { background: transparent; color: var(--accent) }
.btn:disabled { opacity: .45; cursor: not-allowed }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.progress { min-width: 200px; display: grid; gap: 4px; font-size: .8rem; color: var(--muted); font-variant-numeric: tabular-nums }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden }
.bar > i { display: block; height: 100%; background: var(--accent); width: 0 }
.banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: .9rem; background: var(--warn-soft); color: var(--warn) }
.grid { display: grid; grid-template-columns: 170px minmax(0, 1fr) minmax(0, 380px); gap: 20px; align-items: start }
@media (max-width: 1100px) { .grid { grid-template-columns: 150px minmax(0, 1fr) } aside.policy { grid-column: 1 / -1 } }
@media (max-width: 700px) { .grid { grid-template-columns: minmax(0, 1fr) } }
nav.docket { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px) }
@media (max-width: 700px) { nav.docket { position: static; grid-template-columns: repeat(10, 1fr) } }
nav.docket button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); padding: 6px 0; font: 500 .8rem var(--f-doc); font-variant-numeric: tabular-nums }
nav.docket button.blind { background: var(--warn-soft); border-color: var(--warn); color: var(--warn) }
nav.docket button.done { background: var(--ok-soft); border-color: var(--ok); color: var(--ok) }
nav.docket button[aria-current="true"] { outline: 2px solid var(--accent); outline-offset: 1px }
.legend { grid-column: 1 / -1; font-size: .75rem; color: var(--muted); display: grid; gap: 2px; margin-top: 6px }
main { display: grid; gap: 16px; min-width: 0 }
.file { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: grid; gap: 14px }
.eyebrow { font: 500 .75rem var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
h2 { font: 600 1.15rem/1.3 var(--f-head); margin: 0 }
.task { font-size: 1rem; max-width: 70ch }
.date { font: 500 .85rem var(--f-doc); color: var(--muted) }
.docs { display: grid; gap: 10px }
.doc { border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.doc header { display: flex; flex-wrap: wrap; gap: 4px 12px; justify-content: space-between; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line) }
.doc .dtype { font-weight: 600 }
.doc .meta { font: .78rem var(--f-doc); color: var(--muted) }
.doc .body { padding: 8px 12px; font: .85rem/1.5 var(--f-doc); overflow-x: auto }
dl.kv { display: grid; grid-template-columns: minmax(120px, max-content) minmax(0, 1fr); gap: 2px 14px; margin: 0 }
dl.kv dt { color: var(--muted) }
dl.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
dl.kv dl.kv { padding-left: 10px; border-left: 2px solid var(--line); margin: 2px 0 }
.orig { color: var(--muted); font-size: .78rem }
fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px }
legend { font-weight: 600; padding: 0; margin-bottom: 4px }
.act { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; align-items: start }
.act input { margin-top: 4px }
.act code { font: 500 .85rem var(--f-doc) }
.act small { grid-column: 2; color: var(--muted) }
.act:has(input:checked) { border-color: var(--accent); background: var(--accent-soft) }
.row { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center }
textarea { width: 100%; min-height: 64px; font: .9rem var(--f-ui); padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink) }
.reveal { display: grid; gap: 12px; padding: 14px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg) }
.pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font: 500 .8rem var(--f-ui) }
.pill.ok { background: var(--ok-soft); color: var(--ok) } .pill.bad { background: var(--bad-soft); color: var(--bad) } .pill.warn { background: var(--warn-soft); color: var(--warn) }
.answers { display: grid; gap: 4px; font-size: .85rem }
.answers div { display: grid; grid-template-columns: minmax(0, 220px) 1fr 3ch; gap: 8px; align-items: center; font-variant-numeric: tabular-nums }
.answers i { display: block; height: 8px; border-radius: 4px; background: var(--muted) }
.answers i.star { background: var(--ok) }
.locked { font-size: .9rem; color: var(--muted) }
aside.policy { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 32px); overflow-y: auto }
@media (max-width: 1100px) { aside.policy { position: static; max-height: none } }
aside.policy h3 { font: 600 1rem var(--f-head); margin: 0 0 8px }
.rule { margin: 0 0 10px; font-size: .86rem; max-width: 65ch }
.rule b { font-family: var(--f-doc) }
.note { font-size: .8rem; color: var(--muted) }
details.help { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; margin-bottom: 16px }
details.help summary { cursor: pointer; font-weight: 600 }
details.help ol { margin: 8px 0 4px; padding-left: 20px; display: grid; gap: 4px; max-width: 80ch }
.status { font-size: .85rem; color: var(--muted); min-height: 1.2em }
.done-all { background: var(--ok-soft); color: var(--ok); padding: 12px 16px; border-radius: 8px }
@media (prefers-reduced-motion: no-preference) { .bar > i { transition: width .3s } }
</style>
